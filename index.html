<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JarGame · J2ME 网页模拟器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>JarGame</h1>
      <label class="btn primary">
        导入 jar
        <input id="file" type="file" accept=".jar,.jad,application/java-archive" hidden />
      </label>
      <span id="title" class="game-title">未加载游戏</span>
      <span id="stats" class="stats"></span>
      <label class="speed" title="按比例加快游戏时钟：帧率和游戏速度一起变化，按游戏保存">
        速度
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </label>
    </header>
    <main class="layout">
      <section class="phone">
        <div class="screen-wrap" id="drop">
          <canvas id="screen" width="240" height="320"></canvas>
          <div id="overlay" class="overlay" hidden></div>
          <div id="hint" class="hint">把 .jar 拖到这里，或点击「导入 jar」</div>
        </div>
        <div class="keypad" id="keypad"></div>
      </section>
      <aside class="side">
        <section class="panel tabbed">
          <nav class="tabs" id="tabs">
            <button data-tab="keys">键位</button>
            <button data-tab="saves">存档</button>
            <button data-tab="cheats">金手指</button>
            <button data-tab="billing">内购</button>
          </nav>
          <div class="tab-body" id="panel-keys" data-panel="keys"></div>
          <div class="tab-body" id="panel-saves" data-panel="saves" hidden></div>
          <div class="tab-body" id="panel-cheats" data-panel="cheats" hidden></div>
          <div class="tab-body" id="panel-billing" data-panel="billing" hidden></div>
        </section>
        <section class="panel log-panel">
          <h2>运行日志</h2>
          <pre id="log"></pre>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
